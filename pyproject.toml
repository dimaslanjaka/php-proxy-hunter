[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "php-proxy-hunter"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "httpx[socks]",
    "beautifulsoup4",
    "pyyaml"
]

[project.scripts]
proxy-checker-opencode = "artisan.proxy_checker_opencode:cli"

[tool.setuptools.packages.find]
where = [
  ".",
  "packages/proxy-hunter-python",
  "packages/proxy-checker-python",
  "packages/rsa-utility",
  "packages/selenium-stealth",
]
include = [
  "artisan*",
  "src*",
  "data*",
  "proxy_hunter*",
  "proxy_checker*",
  "rsa_utility*",
  "selenium_stealth*",
]
exclude = [
  "tests*",
  "tmp*",
  "dist*",
  "build*",
  "venv*",
  ".venv*",
]
namespaces = false

[tool.setuptools.package-data]
data = ["*.json", "*.txt", "*.yaml", "*.yml", "*.sql", "*.csv", "*.tsv", "*.ini", "*.cfg", "*.md"]

[tool.pyright]
pythonVersion = "3.11"
pythonPlatform = "Windows"
include = ["src", "*.py", "data", "django_backend", "tests", "xl", "bas"]
exclude = [
  "**/node_modules",
  "**/__pycache__",
  "**/build",
  ".git",
  "venv/**",
  "**/bin",
  "**/vendor",
  "**/*.egg-info",
  "**/tmp/**",
  "**/dist",
  "**/backups",
  "**/venv",
  "**/.cache",
  "**/.pytest_cache",
  "xl",
  "src",
  "data",
  "django_backend",
  "**/.*",
  ".venv",
]
extraPaths = [
  "venv/Lib/site-packages",
  "packages/proxy-hunter-python",
  "packages/proxy-checker-python",
  "packages/rsa-utility",
  "packages/selenium-stealth",
]
defineConstant = { DEBUG = true }
reportMissingImports = "error"
reportMissingTypeStubs = false
reportPropertyTypeMismatch = "error"
reportOptionalMemberAccess = "warning"

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -v"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
cache_dir = "tmp/pytest"

[tool.black]
line-length = 88
target-version = ["py311"]
required-version = "26"
include = '\.pyi?$'

skip-string-normalization = false
skip-magic-trailing-comma = false
preview = false
unstable = false

extend-exclude = '''
(
  ^/foo.py
  | .*_pb2.py
)
'''

force-exclude = '''
(
  ^/generated/
)
'''
