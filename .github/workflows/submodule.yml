name: Submodule Install

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - main

permissions:
  contents: read

jobs:
  submodule-install:
    name: Install submodules
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false
          token: ${{ secrets.ACCESS_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Configure Git authentication
        env:
          GH_PAT: ${{ secrets.ACCESS_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          git config --global url."https://x-access-token:${GH_PAT}@github.com/".insteadOf "https://github.com/"
          git config --global url."https://x-access-token:${GH_PAT}@github.com/".insteadOf "git@github.com:"

      - name: Check environment
        run: |
          node -v
          npm -v
          git --version
          pwd
          ls -la

      - name: Install submodules using binary-collections
        env:
          GITHUB_TOKEN: ${{ secrets.ACCESS_TOKEN || secrets.GITHUB_TOKEN }}
          GITHUB_ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN || secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.ACCESS_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          npm exec --yes --legacy-peer-deps \
            --package="binary-collections@https://raw.githubusercontent.com/dimaslanjaka/bin/master/releases/bin.tgz" \
            -- submodule-install

      - name: Check submodule status
        run: |
          git submodule status || true
