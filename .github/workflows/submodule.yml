name: Submodule Install

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - main

permissions:
  contents: read

jobs:
  submodule-install:
    name: Install submodules
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false
          token: ${{ secrets.ACCESS_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Configure Git authentication
        env:
          GH_PAT: ${{ secrets.ACCESS_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -euxo pipefail

          git config --global url."https://x-access-token:${GH_PAT}@github.com/".insteadOf "https://github.com/"
          git config --global url."https://x-access-token:${GH_PAT}@github.com/".insteadOf "git@github.com:"
          git config --global url."https://x-access-token:${GH_PAT}@github.com/".insteadOf "ssh://git@github.com/"

      - name: Check environment
        run: |
          set -euxo pipefail

          node -v
          npm -v
          git --version
          pwd
          ls -la

          echo ""
          echo ".gitmodules content:"
          cat .gitmodules || true

      - name: Install binary-collections CLI
        run: |
          set -euxo pipefail

          CLI_DIR="$RUNNER_TEMP/binary-collections-cli"

          rm -rf "$CLI_DIR"
          mkdir -p "$CLI_DIR"

          npm init -y --prefix "$CLI_DIR"

          npm install --prefix "$CLI_DIR" --legacy-peer-deps \
            "binary-collections@https://raw.githubusercontent.com/dimaslanjaka/bin/master/releases/bin.tgz"

          echo ""
          echo "binary-collections package:"
          ls -la "$CLI_DIR/node_modules/binary-collections"

          echo ""
          echo "binary-collections lib:"
          ls -la "$CLI_DIR/node_modules/binary-collections/lib" || true

          echo ""
          echo "npm bin folder:"
          ls -la "$CLI_DIR/node_modules/.bin" || true

          echo ""
          echo "package bin mapping:"
          node -e "console.log(require('$CLI_DIR/node_modules/binary-collections/package.json').bin)"

      - name: Install submodules using binary-collections
        env:
          GITHUB_TOKEN: ${{ secrets.ACCESS_TOKEN || secrets.GITHUB_TOKEN }}
          GITHUB_ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN || secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.ACCESS_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -euxo pipefail

          CLI_DIR="$RUNNER_TEMP/binary-collections-cli"
          SCRIPT="$CLI_DIR/node_modules/binary-collections/lib/submodule-install.cjs"

          if [ ! -f "$SCRIPT" ]; then
            echo "ERROR: submodule-install.cjs not found."
            echo "Available files:"
            find "$CLI_DIR/node_modules/binary-collections" -maxdepth 3 -type f | sort
            exit 1
          fi

          node "$SCRIPT"

      - name: Check submodule status
        if: always()
        run: |
          git submodule status || true
          git status --short || true
